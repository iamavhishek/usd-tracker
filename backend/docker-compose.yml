services:
  api:
    build:
      context: .
    image: usd-tracker-api:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/usd-tracker.db
      MIGRATIONS_DIR: /app/drizzle
    volumes:
      # Persist SQLite (WAL mode) across container restarts.
      - usd-tracker-data:/app/data
      # Mount the Firebase service account read-only.
      - ./secrets:/app/secrets:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  usd-tracker-data:
