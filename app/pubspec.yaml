name: usd_tracker
description: "USD/NPR exchange-rate tracker with live rate, history, threshold alerts and Firebase push."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  bloc_concurrency: ^0.3.0
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^23.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  json_annotation: ^4.12.0
  reactive_forms:
    path: vendor/reactive_forms
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

# path_provider_android 2.3.x pulls the jni_flutter Gradle plugin, which still
# compiles against API 35 and fails against Firebase's API 37 requirement.
# The 2.2.x line has the same API without JNI.
dependency_overrides:
  path_provider_android: 2.2.23
